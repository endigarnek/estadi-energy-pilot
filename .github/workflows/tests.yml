name: Testy integracji

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Zainstaluj walidator YAML dla testów pulpitu
        run: python -m pip install "PyYAML==6.0.2"
      - name: Sprawdź składnię
        run: python -m compileall -q custom_components/estadi_energy_pilot
      - name: Testy silnika
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sprawdź składnię karty prognozy JS
        run: node --check custom_components/estadi_energy_pilot/forecast_card.js
      - name: Sprawdź nowe karty szczegółowe
        run: |
          node --check custom_components/estadi_energy_pilot/details_card.js
          node --test tests/test_details_card.mjs
      - name: Sprawdź składnię nowego centrum energii JS
        run: node --check custom_components/estadi_energy_pilot/overview_card.js
      - name: Sprawdź składnię operacyjnej karty JS
        run: node --check custom_components/estadi_energy_pilot/control_card.js
      - name: Testy kompaktowego centrum energii
        run: node --test tests/test_control_card.mjs
      - name: Testy pulpitu live i obsługi nieznanych odczytów
        run: node --test tests/test_overview_card.mjs
      - name: Testy interaktywnego wykresu, DST i bezpieczeństwa
        run: node --test tests/test_forecast_card.mjs
