name: Wizualny test pulpitu ESTADI
on:
  pull_request:
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalacja testowej przeglądarki
        run: |
          npm install --no-save playwright@1.57.0 @mdi/js@7.4.47
          npx playwright install chromium
      - name: Renderuj i sprawdź widok PC, mobile, light i dark
        run: node tests/visual/preview.mjs
      - name: Zachowaj podglądy ekranu
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estadi-energy-pilot-ui-previews
          path: visual-artifacts/*.png
          if-no-files-found: warn
