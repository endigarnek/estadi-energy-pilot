name: Walidacja HACS
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdzenie zgodności HACS
        uses: hacs/action@main
        with:
          category: integration
